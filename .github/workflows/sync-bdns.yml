name: ARENA - Sync BDNS Subvenciones

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limpiar_cursor:
        description: 'Resetear cursor de sincronización (full sync)'
        required: false
        default: 'false'

jobs:
  sync-bdns:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BDNS_API_KEY: ${{ secrets.BDNS_API_KEY }}
      DEBUG: false
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Instalar dependencias
        run: npm install
      
      - name: Ejecutar sincronización BDNS
        run: node bdns-connector.mjs
        continue-on-error: true
  
  analizar-ia-bdns:
    needs: sync-bdns
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    if: success()
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Instalar dependencias
        run: npm install
      
      - name: Ejecutar análisis IA (Gemini)
        run: node analizar-bdns-ia.mjs
        continue-on-error: true
